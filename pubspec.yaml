name: nexus_social
description: "Piazly: mappa sociale, chat cifrata, scambio e vendita vicino a te."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  supabase_flutter: ^2.18.3
  material_ui: ^1.11.0
  # Fase 2, Blocco 2: foto profilo dalla galleria, ridotta e ricodificata sul telefono.
  image_picker: ^1.1.2
  image: ^4.3.0
  # Apertura dei social del profilo nell'app del social o nel browser.
  url_launcher: ^6.3.1
  # Fase 2, Blocco 4: codice del telefono nella memoria protetta; sblocco con impronta o volto.
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.3.0
  # Fase 2, Blocco 5: SHA-256 per l'OPRF della rubrica; lettura dei contatti con permesso.
  crypto: ^3.0.6
  flutter_contacts: ^1.1.9+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bozze legali mostrate alla registrazione con l'avviso «bozza non validata» (Fase 2, S7).
  assets:
    - docs/fase0/BOZZA_TERMINI_USO.md
    - docs/fase0/BOZZA_PRIVACY_POLICY.md
    - docs/fase0/BOZZA_REGOLE_COMMUNITY.md
