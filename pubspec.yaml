name: nexus_social
description: "Piazly: mappa sociale, chat cifrata, scambio e vendita vicino a te."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  supabase_flutter: ^2.18.3
  material_ui: ^1.11.0
  # Fase 2, Blocco 2: foto profilo dalla galleria, ridotta e ricodificata sul telefono.
  image_picker: ^1.1.2
  image: ^4.3.0
  # Apertura dei social del profilo nell'app del social o nel browser.
  url_launcher: ^6.3.1
  # Fase 2, Blocco 4: codice del telefono nella memoria protetta; sblocco con impronta o volto.
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.3.0
  # Fase 2, Blocco 5: SHA-256 per l'OPRF della rubrica; lettura dei contatti con permesso.
  crypto: ^3.0.6
  flutter_contacts: ^1.1.9+2
  # Fase 3, Blocco 1: mappa MapLibre con tile OpenFreeMap (F9) e posizione del telefono.
  maplibre_gl: ^0.28.0
  geolocator: ^14.0.2
  # Stato vero dei permessi in Privacy → Autorizzazioni (Blocco 14).
  # 12.x: la 13 richiede di compilare con Android 37, non ancora disponibile qui.
  permission_handler: ">=12.0.1 <13.0.0"
  # Fase 3, Blocco 4: «Condividi» un annuncio nelle altre app.
  share_plus: ^13.3.1
  # Fase 4: cifratura delle chat con MLS (RFC 9420), licenza MIT.
  openmls: 4.0.0
  path_provider: ^2.1.5
  # Fase 4, Blocco 3: allegati cifrati (AES-256-GCM), vocali, video, documenti.
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  record: ^6.0.0
  just_audio: ^0.10.4
  # Chiamate vocali e video (Fase 4, Blocco 8), licenza MIT.
  flutter_webrtc: ">=0.12.0 <2.0.0"
  # Suoneria della chiamata in arrivo sul canale «suoneria» (rispetta il silenzioso), licenza MIT.
  audio_session: ">=0.1.21 <0.3.0"
  video_player: ^2.10.0
  file_picker: ">=12.0.0-beta.1 <15.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bozze legali mostrate alla registrazione con l'avviso «bozza non validata» (Fase 2, S7).
  assets:
    - docs/fase0/BOZZA_TERMINI_USO.md
    - docs/fase0/BOZZA_PRIVACY_POLICY.md
    - docs/fase0/BOZZA_REGOLE_COMMUNITY.md
    # Comuni d'Italia (ISTAT) con il centro di ciascuno, per la località degli annunci.
    - assets/data/comuni_italia.json
