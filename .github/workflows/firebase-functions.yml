name: Cloud Functions

# Test delle Cloud Functions (Fase 2, S1) sugli emulatori Auth e Functions, progetto fittizio
# demo-nexus-social. Nessun secret, nessun deploy, nessun collegamento a Firebase reale (F8).
on:
  push:
    paths:
      - 'firebase/functions/**'
      - 'firebase.json'
      - '.github/workflows/firebase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  functions-tests:
    name: Cloud Functions · test sugli emulatori
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase/functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Con il lockfile versionato l'installazione è riproducibile (npm ci).
      - name: Dipendenze
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] && npm ci --no-audit --no-fund; then
            echo "Dipendenze dal lockfile."
          else
            echo "::warning::package-lock.json assente o non allineato: installazione con npm install."
            npm install --no-audit --no-fund
          fi

      - name: Versioni
        run: |
          node --version
          npx firebase --version
          npm ls --depth=0

      # Finché il lockfile non è nel repository, lo si riporta nel log (codificato) per poterlo
      # versionare. Contiene solo nomi e versioni dei pacchetti.
      - name: Lockfile da versionare
        run: |
          if ! git ls-files --error-unmatch package-lock.json > /dev/null 2>&1 \
             || ! git diff --quiet -- package-lock.json; then
            echo "LOCKFILE_INIZIO"
            gzip -9c package-lock.json | base64 -w0
            echo
            echo "LOCKFILE_FINE"
          fi

      - name: Controllo sintassi
        run: npm run check

      - name: Test OPRF (vettori ufficiali RFC 9497)
        run: npm run test:oprf

      - name: Test (emulatori Auth, Functions e Firestore)
        run: npm test
