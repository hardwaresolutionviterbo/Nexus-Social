name: Supabase RLS

# Test di sicurezza dello schema Supabase (regola R3) su un database TEMPORANEO creato qui
# con la Supabase CLI. Nessun secret, nessun collegamento al progetto reale, nessun deploy.
# Le migrazioni di supabase/migrations/ vengono applicate solo al progetto temporaneo.
on:
  push:
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-rls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-tests:
    name: Supabase · test RLS su database temporaneo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Elenco atteso: migrazioni applicate al database reale con autorizzazione del titolare
      # (0001, 0002 il 14/11/2026) più quelle del blocco in corso, provate SOLO qui sul
      # database temporaneo (0003-0005, Fase 2 Blocchi 2-4: in attesa di autorizzazione per il reale).
      # Una nuova migrazione va aggiunta qui consapevolmente.
      - name: Migrazioni approvate
        run: |
          set -euo pipefail
          found=$(ls supabase/migrations | tr '\n' ' ')
          expected="0001_init.sql 0002_identita_firebase_e_dati_privati.sql 0003_profilo_completo.sql 0004_privacy_e_blocchi.sql 0005_sicurezza_account.sql "
          echo "Migrazioni: ${found}"
          if [ "${found}" != "${expected}" ]; then
            echo "::error::supabase/migrations contiene migrazioni non approvate dal titolare."
            exit 1
          fi

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Progetto temporaneo con le migrazioni
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/supabase-temporaneo"
          mkdir -p "${work}"
          cd "${work}"
          supabase init < /dev/null
          mkdir -p supabase/migrations
          cp "${GITHUB_WORKSPACE}"/supabase/migrations/*.sql supabase/migrations/
          ls supabase/migrations
          echo "SB_WORKDIR=${work}" >> "${GITHUB_ENV}"

      - name: Avvia Supabase temporaneo e applica le migrazioni
        run: |
          set -euo pipefail
          cd "${SB_WORKDIR}"
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,mailpit
          supabase status -o env > "${RUNNER_TEMP}/sb.env"
          for k in API_URL ANON_KEY JWT_SECRET DB_URL SERVICE_ROLE_KEY; do
            v=$(grep -E "^${k}=" "${RUNNER_TEMP}/sb.env" | head -1 | cut -d= -f2- | tr -d '"')
            [ -n "${v}" ] && echo "::add-mask::${v}"
          done
          echo "Supabase temporaneo pronto."

      - name: Test di sicurezza (A, B, C, D, D2, E, F, G, H)
        run: |
          set -euo pipefail
          read_env() { grep -E "^$1=" "${RUNNER_TEMP}/sb.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          export API_URL="$(read_env API_URL)"
          export ANON_KEY="$(read_env ANON_KEY)"
          export JWT_SECRET="$(read_env JWT_SECRET)"
          export DB_URL="$(read_env DB_URL)"
          python3 supabase/tests/rls_test.py

  # Controprova: con un difetto introdotto apposta, i test devono accorgersene.
  controprova:
    name: Supabase · controprova (${{ matrix.difetto }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - difetto: dati_privati_aperti
            caso: B1
          - difetto: altro_progetto_accettato
            caso: C4
          - difetto: posizione_esatta_esposta
            caso: D2.1
          - difetto: bio_nascosta_esposta
            caso: F3
          - difetto: eta_non_controllata
            caso: F1
          - difetto: blocco_ignorato
            caso: G4
          - difetto: pin_ignorato
            caso: H3

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Database temporaneo con difetto di prova
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/supabase-controprova"
          mkdir -p "${work}" && cd "${work}"
          supabase init < /dev/null
          mkdir -p supabase/migrations
          cp "${GITHUB_WORKSPACE}"/supabase/migrations/*.sql supabase/migrations/
          cp "${GITHUB_WORKSPACE}/supabase/tests/controprove/${{ matrix.difetto }}.sql" \
            supabase/migrations/9999_difetto_di_prova.sql
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta,realtime,mailpit
          supabase status -o env > "${RUNNER_TEMP}/sb.env"
          for k in API_URL ANON_KEY JWT_SECRET DB_URL SERVICE_ROLE_KEY; do
            v=$(grep -E "^${k}=" "${RUNNER_TEMP}/sb.env" | head -1 | cut -d= -f2- | tr -d '"')
            [ -n "${v}" ] && echo "::add-mask::${v}"
          done
          echo "Database con difetto di prova pronto."

      - name: I test devono rilevare il difetto (${{ matrix.caso }})
        env:
          EXPECT_FAIL: ${{ matrix.caso }}
        run: |
          set -euo pipefail
          read_env() { grep -E "^$1=" "${RUNNER_TEMP}/sb.env" | head -1 | cut -d= -f2- | tr -d '"'; }
          export API_URL="$(read_env API_URL)"
          export ANON_KEY="$(read_env ANON_KEY)"
          export JWT_SECRET="$(read_env JWT_SECRET)"
          export DB_URL="$(read_env DB_URL)"
          python3 supabase/tests/rls_test.py
