name: Android APK

# Ogni push su main o su un ramo di lavoro della Fase 1 (fase1/...) compila l'APK di prova
# scaricabile dal telefono: Actions → Android APK → esecuzione → Artifacts.
# Il nome dell'artifact e del file contiene versione, numero di build, commit e ramo,
# es. nexus-social-0.1.0+1202-a1b2c3d-fase1-blocco1.
on:
  push:
    branches: [main, 'fase1/**', 'fase2/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Nexus Social · APK di prova
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_name: ${{ steps.ids.outputs.apk_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Regola R1: numero di build = run_number × 100 + run_attempt.
      # Una riesecuzione della stessa build ha un run_attempt diverso, quindi un numero diverso.
      - name: Identificativi della build
        id: ids
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${RUN_ATTEMPT}" -gt 99 ]; then
            echo "::error::Più di 99 tentativi per la stessa esecuzione: il numero di build si ripeterebbe. Avvia una nuova esecuzione."
            exit 1
          fi
          build_number=$(( RUN_NUMBER * 100 + RUN_ATTEMPT ))
          version=$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml)
          if [ -z "${version}" ]; then
            echo "::error::Versione non trovata in pubspec.yaml."
            exit 1
          fi
          if ! grep -q "static const String version = '${version}';" lib/core/config/app_config.dart; then
            echo "::error::La versione di pubspec.yaml (${version}) non coincide con AppInfo.version."
            exit 1
          fi
          if ! printf '%s' "${BRANCH}" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Nome del ramo con caratteri non ammessi."
            exit 1
          fi
          short_sha="${COMMIT_SHA:0:7}"
          safe_branch=$(printf '%s' "${BRANCH}" | tr '/' '-')
          apk_name="nexus-social-${version}+${build_number}-${short_sha}-${safe_branch}"
          {
            echo "APP_VERSION=${version}"
            echo "BUILD_NUMBER=${build_number}"
            echo "GIT_COMMIT=${COMMIT_SHA}"
            echo "GIT_BRANCH=${BRANCH}"
            echo "APK_NAME=${apk_name}"
          } >> "${GITHUB_ENV}"
          echo "apk_name=${apk_name}" >> "${GITHUB_OUTPUT}"
          {
            echo "## APK Nexus Social"
            echo ""
            echo "| Dato | Valore |"
            echo "|---|---|"
            echo "| Versione | ${version} |"
            echo "| Numero di build | ${build_number} |"
            echo "| Esecuzione / tentativo | ${RUN_NUMBER} / ${RUN_ATTEMPT} |"
            echo "| Commit | \`${COMMIT_SHA}\` |"
            echo "| Ramo | \`${BRANCH}\` |"
            echo "| Data (UTC) | $(date -u '+%Y-%m-%d %H:%M') |"
            echo "| File APK | \`${apk_name}.apk\` |"
            echo "| Riga Versione nell'app | ${version} (${build_number}) · ${short_sha} · ${BRANCH} |"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "Build ${build_number} · ${short_sha} · ${BRANCH}"

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter 3.50.0
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      # Android genera un keystore debug casuale al primo build. Riutilizzarlo
      # tra le run mantiene stabile lo SHA-1 necessario a Firebase.
      - name: Cache keystore debug
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nexus-social-debug-keystore-v1

      - name: Dipendenze
        run: flutter pub get

      # Se pubspec.lock non è allineato al pubspec (nuove dipendenze), lo stampa in base64
      # per poterlo salvare nel repository. Nessun dato sensibile: solo versioni dei pacchetti.
      - name: Controllo pubspec.lock
        run: |
          if git diff --quiet -- pubspec.lock; then
            echo "pubspec.lock allineato."
          else
            echo "::warning::pubspec.lock aggiornato da flutter pub get: va salvato nel repository."
            echo "PUBSPEC_LOCK_BASE64_START"
            base64 -w0 pubspec.lock
            echo
            echo "PUBSPEC_LOCK_BASE64_END"
          fi

      - name: Analisi statica
        run: flutter analyze

      # Regola F8: i test non ricevono chiavi né configurazioni di servizi reali.
      - name: Isolamento dei test
        run: |
          set -euo pipefail
          for f in android/app/google-services.json ios/Runner/GoogleService-Info.plist lib/firebase_options.dart env.json; do
            if [ -e "${f}" ]; then
              echo "::error::${f} presente prima dei test: i test devono girare senza configurazioni reali."
              exit 1
            fi
          done
          for v in GOOGLE_SERVICES_JSON SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -n "${!v:-}" ]; then
              echo "::error::${v} presente nell'ambiente dei test."
              exit 1
            fi
          done
          echo "Test isolati: nessuna chiave e nessuna configurazione di servizi reali."

      # I test ricevono gli stessi identificativi dell'APK (nessuna chiave, nessun servizio).
      # Seconda esecuzione: solo F6 con FIREBASE_ENABLED=true, senza inizializzare Firebase.
      - name: Test
        run: |
          flutter test \
            --dart-define=BUILD_NUMBER="${BUILD_NUMBER}" \
            --dart-define=GIT_COMMIT="${GIT_COMMIT}" \
            --dart-define=GIT_BRANCH="${GIT_BRANCH}"
          flutter test test/regression/f6_push_diagnostics_test.dart \
            --dart-define=FIREBASE_ENABLED=true

      - name: Configura Firebase (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib

          raw = os.environ.get("GOOGLE_SERVICES_JSON", "").strip()
          if not raw:
              print("::warning::GOOGLE_SERVICES_JSON assente: la build procede senza Firebase.")
              raise SystemExit(0)

          try:
              data = json.loads(raw) if raw.startswith("{") else json.loads(base64.b64decode(raw))
          except Exception:
              print("::error::GOOGLE_SERVICES_JSON non è JSON valido (né JSON né base64 di JSON).")
              raise SystemExit(1)

          package = "com.nexussocial.app"
          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in data.get("client", [])
          ]
          if package not in packages:
              print(f"::error::google-services.json non contiene l'app Android {package}.")
              raise SystemExit(1)

          pathlib.Path("android/app/google-services.json").write_text(
              json.dumps(data), encoding="utf-8"
          )
          print(f"google-services.json pronto per {package}.")
          PY
        # Il contenuto del secret non viene mai stampato: solo l'esito della validazione.

      - name: Verifica connessione Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::warning::Supabase non configurato: aggiungi SUPABASE_URL e SUPABASE_ANON_KEY in Settings → Secrets and variables → Actions."
            exit 0
          fi
          base="${SUPABASE_URL%/}"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${base}/rest/v1/profiles?select=id&limit=1")
          echo "Supabase /rest/v1/profiles → HTTP ${code}"
          if [ "${code}" != "200" ]; then
            echo "::error::Supabase non raggiungibile o schema non applicato (HTTP ${code}). Controlla URL, chiave e migrazione 0001_init.sql."
            exit 1
          fi
          echo "Supabase raggiungibile e schema presente."

      - name: Build APK (debug)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -f android/app/google-services.json ]; then
            FIREBASE_ENABLED=true
          else
            FIREBASE_ENABLED=false
          fi
          flutter build apk --debug \
            --build-name="${APP_VERSION}" \
            --build-number="${BUILD_NUMBER}" \
            --dart-define=BUILD_NUMBER="${BUILD_NUMBER}" \
            --dart-define=GIT_COMMIT="${GIT_COMMIT}" \
            --dart-define=GIT_BRANCH="${GIT_BRANCH}" \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY}" \
            --dart-define=FIREBASE_ENABLED="${FIREBASE_ENABLED}" \
            --dart-define=SERVER_LINK_ENABLED=false

      # SHA-1/SHA-256 del certificato debug usato da questo APK. Con la cache
      # il keystore è riutilizzato tra le run; lo SHA-1 va comunque registrato
      # nell'app Android Firebase se la API key è vincolata al certificato.
      - name: Impronte certificato Android (debug)
        run: |
          set -euo pipefail
          keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            | grep -E 'SHA1:|SHA256:'

      - name: Verifica Firebase nell'APK
        run: |
          set -euo pipefail
          if [ ! -f android/app/google-services.json ]; then
            echo "Firebase non configurato: controllo saltato."
            exit 0
          fi
          values=$(grep -rl "google_app_id" build/app/generated/res 2>/dev/null | head -1)
          if [ -z "${values}" ]; then
            echo "::error::Il plugin Google Services non ha generato le risorse Firebase."
            exit 1
          fi
          grep -q "google_app_id" "${values}"
          echo "Firebase configurato nell'APK (google_app_id presente)."

      # Regola R1: rilegge dall'APK prodotto versione, numero di build, commit e ramo.
      - name: Verifica identificativi nell'APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          aapt2=$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)aapt2
          badging=$("${aapt2}" dump badging "${apk}" | head -1)
          code=$(printf '%s' "${badging}" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          name=$(printf '%s' "${badging}" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "APK: versionName=${name} versionCode=${code}"
          [ "${code}" = "${BUILD_NUMBER}" ] || { echo "::error::Numero di build nell'APK (${code}) diverso da ${BUILD_NUMBER}."; exit 1; }
          [ "${name}" = "${APP_VERSION}" ] || { echo "::error::Versione nell'APK (${name}) diversa da ${APP_VERSION}."; exit 1; }
          kernel=$(mktemp)
          unzip -p "${apk}" assets/flutter_assets/kernel_blob.bin > "${kernel}"
          grep -aqF "${GIT_COMMIT}" "${kernel}" || { echo "::error::Commit assente dal codice dell'app."; exit 1; }
          grep -aqF "${GIT_BRANCH}" "${kernel}" || { echo "::error::Ramo assente dal codice dell'app."; exit 1; }
          rm -f "${kernel}"
          echo "Identificativi letti dall'APK: OK"

      # Regola F10: nessun link esterno verso schermate interne, nessuna chiave privilegiata.
      - name: Controlli di sicurezza sull'APK
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          aapt2=$(ls -d "${ANDROID_HOME}"/build-tools/*/ | sort -V | tail -1)aapt2
          "${aapt2}" dump xmltree --file AndroidManifest.xml "${apk}" > manifest.txt
          python3 - manifest.txt <<'PY'
          import re, sys
          # Un deep link è un intent-filter di un'activity con azione VIEW o con <data>.
          # Le <queries> delle librerie non aprono l'app. Sono ammesse solo le activity
          # elencate qui, che non portano a schermate di Nexus Social.
          ALLOWED = {
              # Firebase Authentication: ritorno dalla verifica reCAPTCHA/browser
              # usata dal login con numero di telefono (Fase 2).
              "com.google.firebase.auth.internal.GenericIdpActivity",
              "com.google.firebase.auth.internal.RecaptchaActivity",
          }
          stack, found = [], {}
          activity = None
          for line in open(sys.argv[1], encoding="utf-8", errors="replace"):
              depth = len(line) - len(line.lstrip(" "))
              text = line.strip()
              while stack and stack[-1][0] >= depth:
                  stack.pop()
              names = [n for _, n in stack]
              if text.startswith("E: "):
                  name = text[3:].split(" ")[0]
                  stack.append((depth, name))
                  if name in ("activity", "activity-alias"):
                      activity = "?"
                  names = [n for _, n in stack]
                  if name == "data" and "intent-filter" in names and activity:
                      found.setdefault(activity, set()).add("data")
              elif text.startswith("A: "):
                  m = re.search(r':name\(0x01010003\)="([^"]+)"', text)
                  if m and names and names[-1] in ("activity", "activity-alias"):
                      activity = m.group(1)
                  if 'android.intent.action.VIEW"' in text:
                      if "intent-filter" in names and ("activity" in names or "activity-alias" in names):
                          found.setdefault(activity, set()).add("VIEW")
                      else:
                          print("Ammesso (consultazione di altre app, non apre Nexus Social): " + " > ".join(names))
          problems = 0
          for name, kinds in sorted(found.items()):
              if name in ALLOWED:
                  print(f"Ammesso: {name} ({', '.join(sorted(kinds))}) - libreria Firebase Auth")
              else:
                  print(f"::error::Deep link non ammesso: {name} ({', '.join(sorted(kinds))})")
                  problems += 1
          if problems:
              sys.exit(1)
          PY
          rm -f manifest.txt
          echo "Manifesto: solo avvio normale, nessun deep link."
          python3 - "${apk}" <<'PY'
          import base64, json, re, sys, zipfile
          apk = zipfile.ZipFile(sys.argv[1])
          jwt = re.compile(rb"eyJ[A-Za-z0-9_-]{8,}\.(eyJ[A-Za-z0-9_-]{8,})\.[A-Za-z0-9_-]{8,}")
          problems = 0
          for name in apk.namelist():
              data = apk.read(name)
              # Chiavi segrete Supabase nel formato nuovo (sb_secret_...): mai nell'app.
              if re.search(rb"sb_secret_[A-Za-z0-9_-]{16,}", data):
                  print(f"::error::Chiave segreta Supabase (sb_secret_) in {name}.")
                  problems += 1
              # La parola «service_role» in chiaro non è una chiave (le chiavi sono token
              # codificati, controllati sotto): si mostra solo il contesto, per trasparenza.
              for m in re.finditer(rb"service_role", data):
                  ctx = data[max(0, m.start() - 40): m.end() + 40]
                  ctx = re.sub(rb"[^A-Za-z0-9_ .:/-]", b" ", ctx).decode()
                  print(f"Informazione: parola service_role in {name}: ...{ctx}...")
              for match in jwt.finditer(data):
                  part = match.group(1) + b"=" * (-len(match.group(1)) % 4)
                  try:
                      role = json.loads(base64.urlsafe_b64decode(part)).get("role")
                  except Exception:
                      continue
                  if role not in (None, "anon"):
                      print(f"::error::Token con ruolo non pubblico in {name}.")
                      problems += 1
          if problems:
              sys.exit(1)
          print("Nessuna chiave privilegiata nell'APK (solo chiavi pubbliche previste).")
          PY

      - name: Prepara APK per la consegna
        run: |
          set -euo pipefail
          mkdir -p build/consegna
          cp build/app/outputs/flutter-apk/app-debug.apk "build/consegna/${APK_NAME}.apk"
          echo "Identificativi verificati: ${APK_NAME}.apk"

      - name: Carica APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: build/consegna/${{ env.APK_NAME }}.apk
          if-no-files-found: error
          retention-days: 14

  firebase-runtime:
    name: Nexus Social · verifica runtime Firebase
    needs: build-apk
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scarica APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-apk.outputs.apk_name }}
          path: apk

      # Lo script di verifica si aspetta apk/app-debug.apk.
      - name: Prepara APK per la verifica
        run: |
          set -euo pipefail
          count=$(ls apk/*.apk | wc -l)
          [ "${count}" -eq 1 ] || { echo "::error::Attesi 1 APK, trovati ${count}."; exit 1; }
          cp apk/*.apk apk/app-debug.apk

      - name: Abilita KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Avvia emulatore e verifica Firebase
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # L'azione esegue ogni riga come comando separato: lo script deve stare in un file.
          script: bash firebase/verify_android_runtime.sh
