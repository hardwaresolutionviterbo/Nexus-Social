name: Vettori di prova RFC (temporaneo)

# Scarica i testi ufficiali RFC 9497 (OPRF) e RFC 9380 (hash-to-curve) e stampa le sezioni con i
# vettori di prova per P-256, da copiare nei test. Nessun segreto, nessun servizio.
on:
  push:
    paths:
      - '.github/workflows/vettori-rfc.yml'

permissions:
  contents: read

jobs:
  vettori:
    runs-on: ubuntu-latest
    steps:
      - name: RFC 9497 · P256-SHA256 OPRF
        run: |
          for u in https://www.rfc-editor.org/rfc/rfc9497.txt https://www.ietf.org/rfc/rfc9497.txt https://datatracker.ietf.org/doc/rfc9497/txt/ https://raw.githubusercontent.com/cfrg/draft-irtf-cfrg-voprf/main/draft-irtf-cfrg-voprf.md; do
            if curl -sSL -A "Mozilla/5.0" --fail "$u" -o 9497.txt; then echo "scaricato da $u"; break; else echo "fallito $u"; fi
          done
          wc -l 9497.txt || true
          awk '/A.3.  OPRF\(P-256, SHA-256\)/{f=1} /A.3.2.  VOPRF Mode/{f=0} f' 9497.txt | grep -v "^RFC 9497\|^Davidson" || true
          echo "----- contesto -----"
          grep -n "contextString\|HashToGroup-\|\"Finalize\"\|DeriveKeyPair" 9497.txt | head -40
      - name: RFC 9380 · P256_XMD:SHA-256_SSWU_RO_
        if: always()
        run: |
          for u in https://www.rfc-editor.org/rfc/rfc9380.txt https://www.ietf.org/rfc/rfc9380.txt https://datatracker.ietf.org/doc/rfc9380/txt/; do
            if curl -sSL -A "Mozilla/5.0" --fail "$u" -o 9380.txt; then echo "scaricato da $u"; break; else echo "fallito $u"; fi
          done
          wc -l 9380.txt || true
          awk '/J.1.1.  P256_XMD:SHA-256_SSWU_RO_/{f=1} /J.1.2.  P256_XMD:SHA-256_SSWU_NU_/{f=0} f' 9380.txt | grep -v "^RFC 9380\|^Faz-Hernandez" || true
          echo "----- expand_message_xmd SHA-256 -----"
          awk '/K.1.  expand_message_xmd\(SHA-256\)/{f=1} /K.2.  expand_message_xmd\(SHA-256\) \(long DST\)/{f=0} f' 9380.txt | head -60
