name: Vettori di prova RFC (temporaneo)

# Scarica i testi ufficiali RFC 9497 (OPRF) e RFC 9380 (hash-to-curve) e stampa le sezioni con i
# vettori di prova per P-256, da copiare nei test. Nessun segreto, nessun servizio.
on:
  push:
    paths:
      - '.github/workflows/vettori-rfc.yml'

permissions:
  contents: read

jobs:
  vettori:
    runs-on: ubuntu-latest
    steps:
      - name: RFC 9497 · P256-SHA256 OPRF
        run: |
          for u in https://www.rfc-editor.org/rfc/rfc9497.txt https://www.ietf.org/rfc/rfc9497.txt https://datatracker.ietf.org/doc/rfc9497/txt/ https://raw.githubusercontent.com/cfrg/draft-irtf-cfrg-voprf/main/draft-irtf-cfrg-voprf.md; do
            if curl -sSL -A "Mozilla/5.0" --fail "$u" -o 9497.txt; then echo "scaricato da $u"; break; else echo "fallito $u"; fi
          done
          wc -l 9497.txt || true
          start=$(grep -n "^A.3.1.  OPRF Mode" 9497.txt | tail -1 | cut -d: -f1)
          end=$(grep -n "^A.3.2.  VOPRF Mode" 9497.txt | tail -1 | cut -d: -f1)
          echo "righe $start-$end"
          sed -n "${start},${end}p" 9497.txt
          echo "----- definizioni -----"
          sed -n '380,400p;690,712p;840,915p;1190,1240p;1318,1345p' 9497.txt
