name: Vettori di prova RFC (temporaneo)

# Scarica i testi ufficiali RFC 9497 (OPRF) e RFC 9380 (hash-to-curve) e stampa le sezioni con i
# vettori di prova per P-256, da copiare nei test. Nessun segreto, nessun servizio.
on:
  push:
    paths:
      - '.github/workflows/vettori-rfc.yml'

permissions:
  contents: read

jobs:
  vettori:
    runs-on: ubuntu-latest
    steps:
      - name: RFC 9497 · P256-SHA256 OPRF
        run: |
          curl -fsSL https://www.rfc-editor.org/rfc/rfc9497.txt -o 9497.txt
          awk '/A.3.  OPRF\(P-256, SHA-256\)/{f=1} /A.3.2.  VOPRF Mode/{f=0} f' 9497.txt | grep -v "^RFC 9497\|^Davidson" 
          echo "----- contesto -----"
          grep -n "contextString\|HashToGroup-\|\"Finalize\"\|DeriveKeyPair" 9497.txt | head -40
      - name: RFC 9380 · P256_XMD:SHA-256_SSWU_RO_
        run: |
          curl -fsSL https://www.rfc-editor.org/rfc/rfc9380.txt -o 9380.txt
          awk '/J.1.1.  P256_XMD:SHA-256_SSWU_RO_/{f=1} /J.1.2.  P256_XMD:SHA-256_SSWU_NU_/{f=0} f' 9380.txt | grep -v "^RFC 9380\|^Faz-Hernandez"
          echo "----- expand_message_xmd SHA-256 -----"
          awk '/K.1.  expand_message_xmd\(SHA-256\)/{f=1} /K.2.  expand_message_xmd\(SHA-256\) \(long DST\)/{f=0} f' 9380.txt | head -60
