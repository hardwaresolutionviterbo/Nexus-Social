name: Anteprime schermate

# Immagini delle nuove schermate per il titolare, con dati inventati e senza servizi reali.
# Le immagini vengono stampate nel log (base64) e allegate come artifact.
on:
  push:
    paths:
      - 'tool/screenshots/**'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anteprime:
    name: Anteprime delle schermate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Disegna le schermate
        run: |
          set -euo pipefail
          flutter precache --no-android --no-ios || true
          flutter test tool/screenshots/profile_screenshots_test.dart --update-goldens

      - name: Immagini nel log
        run: |
          set -euo pipefail
          for f in tool/screenshots/out/*.png; do
            echo "SCREENSHOT_START $(basename "$f")"
            base64 -w0 "$f"
            echo
            echo "SCREENSHOT_END"
          done

      - name: Allega le immagini
        uses: actions/upload-artifact@v4
        with:
          name: anteprime-schermate
          path: tool/screenshots/out/*.png
